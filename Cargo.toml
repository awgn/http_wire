[package]
name = "http_wire"
version = "0.9.0"
edition = "2024"
authors = ["Nicola Bonelli <nicola@larthia.com>"]
description = "Serialize HTTP requests and responses to wire format bytes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awgn/http_wire"
readme = "README.md"
keywords = ["http", "http1", "serialization", "wire-format", "bytes"]
categories = ["network-programming", "web-programming"]

[dependencies]
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
memchr = "2"
thiserror = "2.0.21"

[dev-dependencies]
http-body = "1"

[[bench]]
name = "wire"
harness = false
